[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: marks integration tests
    requires_alpaca: marks tests requiring Alpaca paper trading credentials
    requires_ib: marks tests requiring Interactive Brokers connectivity
    requires_news_api: marks tests requiring real news provider credentials
    requires_finbert: marks tests requiring transformers/torch and FinBERT model download
    slow: marks slower-running integration checks
