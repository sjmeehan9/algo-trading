# Primary provider: Benzinga (selected in Component 3.9)
# Fallback provider: Alpha Vantage
primary_provider: benzinga
fallback_provider: alphavantage

providers:
  benzinga:
    name: Benzinga News API
    base_url: https://api.benzinga.com/api/v2/news
    auth_type: api_key
    auth_header: Authorization
    rate_limit: 100/minute
    poll_interval_seconds: 10
    setup_url: https://www.benzinga.com/apis/
    required_credentials:
      - api_key # Env var: BENZINGA_API_KEY
    provides_sentiment: false

  alphavantage:
    name: Alpha Vantage News Sentiment
    base_url: https://www.alphavantage.co/query
    auth_type: query_param
    auth_param: apikey
    rate_limit: 5/minute
    poll_interval_seconds: 60
    setup_url: https://www.alphavantage.co/support/#api-key
    required_credentials:
      - api_key # Env var: ALPHAVANTAGE_API_KEY
    provides_sentiment: true
